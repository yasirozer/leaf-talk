<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: hsl(220 14% 10%); font-family: 'Inter', sans-serif; }
  .label { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: hsl(220 14% 45%); margin-bottom: 8px; }
  .input-wrap { max-width: 520px; display: flex; align-items: flex-end; gap: 6px; background: hsl(220 14% 14%); border: 1px solid hsl(220 14% 18%); border-radius: 12px; padding: 6px 8px; margin-bottom: 12px; }
  textarea { flex: 1; background: transparent; border: none; outline: none; resize: none; font-size: 14px; color: hsl(220 14% 92%); font-family: 'Inter', sans-serif; padding: 4px 6px; line-height: 1.5; }
  textarea::placeholder { color: hsl(220 14% 45%); }
  .send-btn { padding: 7px; border-radius: 8px; border: none; cursor: pointer; flex-shrink: 0; display: flex; }
  .input-focus { border-color: hsl(142 60% 50% / 0.4); box-shadow: 0 0 0 2px hsl(142 60% 50% / 0.08); }
</style>
</head>
<body class="lt-base">
  <div class="label">Default</div>
  <div class="input-wrap">
    <textarea rows="1" placeholder="Send a message..." readonly></textarea>
    <button class="send-btn" style="background:hsl(142 60% 50%/0.30);color:hsl(220 14% 45%)" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="label">Active (text entered)</div>
  <div class="input-wrap input-focus">
    <textarea rows="1" readonly style="color:hsl(220 14% 92%)">How does the branching work?</textarea>
    <button class="send-btn" style="background:hsl(142 60% 50%);color:hsl(220 14% 6%)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="label">Streaming (stop button)</div>
  <div class="input-wrap">
    <textarea rows="1" placeholder="Send a message..." readonly></textarea>
    <button class="send-btn" style="background:hsl(0 72% 55%);color:hsl(0 0% 98%)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
    </button>
  </div>
</body></html>
