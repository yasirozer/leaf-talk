<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: hsl(220 14% 10%); font-family: 'Inter', sans-serif; }
  .label { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: hsl(220 14% 45%); margin-bottom: 8px; }
  .msg { display: flex; gap: 10px; padding: 12px 0; }
  .avatar { width: 28px; height: 28px; border-radius: 8px; background: hsl(220 14% 14%); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .bubble { border-radius: 12px; padding: 10px 14px; font-size: 14px; line-height: 1.6; max-width: 480px; }
  .actions { display: flex; gap: 3px; background: hsl(220 14% 17%); border: 1px solid hsl(220 14% 18%); border-radius: 8px; padding: 3px; margin-top: 4px; width: fit-content; }
  .act-btn { padding: 4px; border-radius: 4px; border: none; background: transparent; cursor: pointer; color: hsl(220 14% 45%); display: flex; }
  .branch-chip { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; border: 1px solid hsl(142 60% 50% / 0.2); background: hsl(142 60% 50% / 0.05); margin-top: 6px; width: fit-content; cursor: pointer; }
  .thinking { display: flex; align-items: center; gap: 4px; padding: 8px 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: hsl(142 60% 50%); opacity: 0.5; }
</style>
</head>
<body class="lt-base">
  <div class="label">AI Message</div>
  <div class="msg">
    <div class="avatar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="hsl(142 60% 50%)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div>
      <div class="bubble" style="background:hsl(220 14% 14%);color:hsl(220 14% 92%)">Branching allows you to explore <strong>alternative paths</strong> without losing your original context. Select any text to fork a new conversation thread.</div>
      <div class="actions">
        <button class="act-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        <button class="act-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="act-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
        <button class="act-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg></button>
      </div>
      <div class="branch-chip">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="hsl(142 60% 50%)" stroke-width="2"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
        <div>
          <div style="font-size:12px;font-weight:500;color:hsl(142 60% 50%)">explore alternative paths</div>
          <div style="font-size:10px;color:hsl(220 14% 45%)">3:42 pm · 4 msgs</div>
        </div>
        <span style="font-size:10px;color:hsl(220 14% 45%)">View →</span>
      </div>
    </div>
  </div>
  <div class="label">User Message</div>
  <div class="msg" style="justify-content:flex-end">
    <div>
      <div class="bubble" style="background:hsl(142 60% 50%/0.10);border:1px solid hsl(142 60% 50%/0.20);color:hsl(220 14% 92%)">How does the branching context work exactly?</div>
    </div>
    <div class="avatar" style="background:hsl(142 60% 50%/0.20)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="hsl(142 60% 50%)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
  </div>
  <div class="label">Thinking State</div>
  <div class="msg">
    <div class="avatar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="hsl(142 60% 50%)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="bubble" style="background:hsl(220 14% 14%)">
      <div class="thinking">
        <span style="font-size:12px;color:hsl(220 14% 45%);margin-right:4px">Thinking</span>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>
  </div>
</body></html>
